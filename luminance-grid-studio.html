<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luminance Grid Studio</title>
<style>html,body{margin:0;min-height:100%;background:#0b0c0e}body{padding:8px;overflow:hidden}</style>
</head>
<body>
<div id='lgstudio' class='w-full'>
<style>
#lgstudio{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--viz-text)}#lgstudio *{box-sizing:border-box}#lgstudio .app{position:relative;border:1px solid var(--viz-border);border-radius:14px;overflow:hidden;background:var(--viz-card)}#lgstudio .bar{display:flex;gap:7px;align-items:center;padding:8px;border-bottom:1px solid var(--viz-border);background:var(--viz-panel);flex-wrap:wrap}#lgstudio .grow{flex:1}#lgstudio button,#lgstudio select,#lgstudio input{font:inherit}#lgstudio button{border:1px solid var(--viz-border);background:var(--viz-card);color:var(--viz-text);border-radius:7px;padding:7px 10px;font-size:12px;cursor:pointer}#lgstudio button.on,#lgstudio .primary{background:var(--viz-accent-bg);border-color:var(--viz-accent)}#lgstudio .layout{display:grid;grid-template-columns:minmax(0,1fr) 315px}#lgstudio .stageWrap{padding:9px;border-right:1px solid var(--viz-border);min-width:0}#lgstudio .stage{position:relative;min-height:520px;background:var(--viz-panel);border:1px solid var(--viz-border);border-radius:10px;display:grid;place-items:center;overflow:hidden}#lgstudio #view{display:block;max-width:100%;max-height:720px;width:auto;height:auto}#lgstudio .viewTabs{position:absolute;top:10px;left:10px;display:flex;z-index:4;border:1px solid var(--viz-border);border-radius:8px;overflow:hidden;background:var(--viz-panel)}#lgstudio .viewTabs button{border:0;border-radius:0;min-width:78px}#lgstudio .toast{position:absolute;top:10px;right:10px;display:none;padding:6px 8px;background:var(--viz-card);border:1px solid var(--viz-border);border-radius:7px;font-size:11px;z-index:5}#lgstudio .panel{background:var(--viz-panel);padding:0 10px 10px;max-height:760px;overflow:auto}#lgstudio details{border-bottom:1px solid var(--viz-border)}#lgstudio summary{padding:11px 0;cursor:pointer;list-style:none;font-size:12px;font-weight:650;display:flex;justify-content:space-between}#lgstudio summary::-webkit-details-marker{display:none}#lgstudio summary:after{content:'⌄';color:var(--viz-muted)}#lgstudio details:not([open]) summary:after{content:'›'}#lgstudio .sec{padding:0 0 12px;display:flex;flex-direction:column;gap:9px}#lgstudio .row{display:grid;grid-template-columns:95px minmax(0,1fr);gap:9px;align-items:center;font-size:11px}#lgstudio .muted,#lgstudio label{font-size:11px;color:var(--viz-muted)}#lgstudio input[type=range]{width:100%}#lgstudio input[type=text],#lgstudio input[type=number],#lgstudio select{width:100%;border:1px solid var(--viz-border);border-radius:7px;background:var(--viz-card);color:var(--viz-text);padding:7px}#lgstudio input[type=checkbox]{accent-color:var(--viz-accent)}#lgstudio .chips{display:flex;gap:5px;flex-wrap:wrap}#lgstudio .chips button{padding:6px 9px}#lgstudio .hist{border:1px solid var(--viz-border);border-radius:8px;background:var(--viz-card);padding:5px}#lgstudio #hist{display:block;width:100%;height:86px}#lgstudio .swatches,#lgstudio .segments,#lgstudio .thumbs{display:flex;gap:6px;flex-wrap:wrap}#lgstudio .sw{width:30px;height:30px;padding:0;border-radius:7px;position:relative}#lgstudio .sw.sel:after{content:'';position:absolute;inset:-3px;border:1px solid var(--viz-accent);border-radius:9px}#lgstudio .segitem{display:flex;flex-direction:column;gap:3px;align-items:center;font-size:10px;color:var(--viz-muted)}#lgstudio .upload{border:1px dashed var(--viz-border);border-radius:8px;padding:14px;text-align:center;color:var(--viz-muted);cursor:pointer;font-size:11px}#lgstudio .lock{display:flex;gap:6px}#lgstudio .lock input{flex:1}#lgstudio .thumb{width:38px;height:38px;object-fit:cover;border:1px solid var(--viz-border);border-radius:7px;background:#fff}#lgstudio .dim{opacity:.45}#lgstudio .picker{position:absolute;z-index:20;width:242px;padding:10px;background:var(--viz-card);border:1px solid var(--viz-border);border-radius:10px;box-shadow:0 12px 30px #0006;display:none}#lgstudio .sv{height:150px;position:relative;border-radius:8px;cursor:crosshair;background:red}#lgstudio .sv:before{content:'';position:absolute;inset:0;border-radius:8px;background:linear-gradient(to right,#fff,transparent)}#lgstudio .sv:after{content:'';position:absolute;inset:0;border-radius:8px;background:linear-gradient(to top,#000,transparent)}#lgstudio .dot{position:absolute;width:12px;height:12px;border:2px solid white;border-radius:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;box-shadow:0 0 0 1px #0008}#lgstudio .hue{height:14px;border-radius:99px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);cursor:pointer;margin-top:9px}#lgstudio .alpha{height:14px;border-radius:99px;margin-top:8px;cursor:pointer;border:1px solid var(--viz-border);background:linear-gradient(to right,transparent,var(--pc,#f60)),repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0/10px 10px}#lgstudio .pickfields{display:grid;grid-template-columns:1fr 70px;gap:6px;margin-top:8px}#lgstudio .modalBack{display:none;position:absolute;inset:0;background:#0008;z-index:30;align-items:center;justify-content:center;padding:16px}#lgstudio .modal{width:min(360px,100%);background:var(--viz-card);border:1px solid var(--viz-border);border-radius:11px;padding:14px}#lgstudio .actions{display:flex;justify-content:flex-end;gap:7px;margin-top:10px}#lgstudio .hidden{display:none!important}@media(max-width:760px){#lgstudio .layout{grid-template-columns:1fr}#lgstudio .stageWrap{border-right:0;border-bottom:1px solid var(--viz-border)}#lgstudio .stage{min-height:360px}#lgstudio .panel{max-height:none}}
</style>
<style>
/* UI3-inspired application shell: explicit, high-contrast hierarchy and compact controls. */
#lgstudio{
  --app:#111214;--toolbar:#1b1c1f;--canvas:#0c0d0f;--panel:#232427;
  --panel-raised:#2b2c30;--field:#303136;--field-hover:#383a40;
  --line:#3a3b40;--line-soft:#303136;--text:#f0f1f3;--text-2:#c8c9ce;
  --muted:#8d9098;--blue:#4c9aff;--blue-hover:#67aaff;--blue-soft:#163e69;
  --danger:#ff6b6b;--shadow:0 18px 55px rgba(0,0,0,.34);
  width:100%;min-width:0;color:var(--text);background:transparent;
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:12px;line-height:1.35;color-scheme:dark;
}
#lgstudio .app{height:min(880px,calc(100vh - 36px));min-height:680px;border:1px solid #313237;border-radius:12px;overflow:hidden;background:var(--app);box-shadow:var(--shadow)}
#lgstudio .bar{height:48px;padding:0 12px;gap:6px;flex-wrap:nowrap;background:var(--toolbar);border-bottom:1px solid #090a0b;box-shadow:0 1px 0 rgba(255,255,255,.035);position:relative;z-index:10}
#lgstudio .brand{display:flex;align-items:center;gap:9px;margin-right:10px;padding-right:14px;border-right:1px solid var(--line)}
#lgstudio .brandMark{width:22px;height:22px;border-radius:6px;background:linear-gradient(145deg,#78bdff,#3e7ef5);display:grid;place-items:center;color:white;font-size:13px;font-weight:800;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
#lgstudio .brandText{font-size:12px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
#lgstudio .barGroup{display:flex;align-items:center;gap:4px}
#lgstudio button{min-height:28px;border:1px solid transparent;background:transparent;color:var(--text-2);border-radius:6px;padding:5px 9px;font-size:11px;font-weight:520;letter-spacing:.005em;transition:background .12s,border-color .12s,color .12s}
#lgstudio button:hover{background:var(--field-hover);color:var(--text)}
#lgstudio button:focus-visible,#lgstudio input:focus-visible,#lgstudio select:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
#lgstudio .bar button{height:30px;color:#d8d9de}
#lgstudio .bar .quiet{border-color:var(--line);background:#25262a}
#lgstudio .bar .toolOn{border-color:var(--line);background:#28292d}
#lgstudio .bar .divider{width:1px;height:20px;background:var(--line);margin:0 3px}
#lgstudio button.on{background:var(--blue-soft);border-color:#2f6fae;color:#dceeff}
#lgstudio button.primary{background:var(--blue);border-color:#63a8ff;color:#08121f;font-weight:680;padding-inline:13px}
#lgstudio button.primary:hover{background:var(--blue-hover)}
#lgstudio .layout{height:calc(100% - 48px);grid-template-columns:minmax(0,1fr) 320px;background:var(--canvas)}
#lgstudio .stageWrap{padding:0;border-right:1px solid #0a0b0d;min-width:0;background:var(--canvas);position:relative;overflow:hidden}
#lgstudio .stage{height:100%;min-height:0;border:0;border-radius:0;background:
  radial-gradient(circle at 50% 42%,rgba(255,255,255,.035),transparent 34%),
  linear-gradient(45deg,rgba(255,255,255,.012) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.012) 75%),
  linear-gradient(45deg,rgba(255,255,255,.012) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.012) 75%),#111216;
  background-size:auto,24px 24px,24px 24px;background-position:0 0,0 0,12px 12px;overflow:hidden}
#lgstudio #view{max-width:calc(100% - 72px);max-height:calc(100% - 112px);background:#f6f4ef;box-shadow:0 22px 64px rgba(0,0,0,.48),0 0 0 1px rgba(255,255,255,.12);image-rendering:auto}
#lgstudio .viewTabs{top:12px;left:12px;height:30px;padding:2px;gap:1px;border:1px solid var(--line);border-radius:7px;background:#202125;box-shadow:0 5px 18px rgba(0,0,0,.22)}
#lgstudio .viewTabs button{min-width:72px;min-height:24px;height:24px;padding:3px 10px;border:0;border-radius:4px;color:var(--muted);font-size:11px}
#lgstudio .viewTabs button.on{background:#3a3b40;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35)}
#lgstudio .canvasMeta{position:absolute;left:12px;bottom:11px;display:flex;align-items:center;gap:8px;color:#777a82;font-size:10px;letter-spacing:.01em}
#lgstudio .canvasMeta .dotLive{width:6px;height:6px;border-radius:50%;background:#5aa3f8;box-shadow:0 0 0 3px rgba(76,154,255,.12)}
#lgstudio .toast{top:12px;right:12px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#292a2f;color:#f5f6f8;box-shadow:0 8px 24px rgba(0,0,0,.28);font-size:10px}
#lgstudio .panel{height:100%;max-height:none;overflow-y:auto;padding:0;background:var(--panel);border-left:1px solid rgba(255,255,255,.035);scrollbar-width:thin;scrollbar-color:#4a4b50 transparent}
#lgstudio .panelHead{position:sticky;top:0;z-index:6;height:45px;padding:0 12px;display:flex;align-items:center;gap:7px;background:rgba(35,36,39,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#lgstudio .panelHead strong{font-size:12px;font-weight:650;flex:1}
#lgstudio .panelHead .iconBtn{width:28px;padding:0;font-size:14px;color:var(--muted)}
#lgstudio details{margin:0;border:0;border-bottom:1px solid var(--line);background:transparent}
#lgstudio details[open]{background:rgba(255,255,255,.012)}
#lgstudio summary{height:40px;padding:0 12px 0 13px;align-items:center;justify-content:flex-start;gap:7px;color:var(--text);font-size:11px;font-weight:650;letter-spacing:.01em;user-select:none}
#lgstudio summary:hover{background:rgba(255,255,255,.025)}
#lgstudio summary:before{content:'›';width:10px;color:var(--muted);font-size:16px;font-weight:400;transform-origin:center;transition:transform .14s}
#lgstudio details[open]>summary:before{transform:rotate(90deg)}
#lgstudio summary:after{display:none}
#lgstudio .sec{padding:1px 12px 14px 30px;gap:8px}
#lgstudio .row{grid-template-columns:80px minmax(0,1fr);gap:8px;min-height:28px;font-size:10.5px}
#lgstudio .row.rangeDecorated{grid-template-columns:80px minmax(0,1fr) 42px}
#lgstudio .row>label,#lgstudio .row>.muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lgstudio label,#lgstudio .muted{font-size:10.5px;color:var(--muted);font-weight:450}
#lgstudio strong{font-weight:650}
#lgstudio input[type=text],#lgstudio input[type=number],#lgstudio select{height:28px;padding:4px 7px;border:1px solid var(--line);border-radius:5px;background:var(--field);color:var(--text);font-size:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
#lgstudio input[type=text]:hover,#lgstudio input[type=number]:hover,#lgstudio select:hover{background:var(--field-hover)}
#lgstudio input[type=range]{appearance:none;height:16px;margin:0;background:transparent;cursor:pointer}
#lgstudio input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:#585a61}
#lgstudio input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;margin-top:-5px;border:2px solid #d9dae0;border-radius:50%;background:#34353a;box-shadow:0 0 0 1px #161719}
#lgstudio input[type=range]:hover::-webkit-slider-thumb{border-color:#fff;background:var(--blue)}
#lgstudio .rangeReadout{height:24px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:var(--field);color:var(--text-2);font-size:10px;font-variant-numeric:tabular-nums}
#lgstudio input.rangeReadout{width:42px;padding:3px 4px;text-align:center;appearance:textfield;-moz-appearance:textfield}
#lgstudio input.rangeReadout::-webkit-outer-spin-button,#lgstudio input.rangeReadout::-webkit-inner-spin-button{margin:0;appearance:none}
#lgstudio input[type=checkbox]{appearance:none;width:14px;height:14px;margin:0 6px 0 0;vertical-align:-2px;border:1px solid #61636b;border-radius:3px;background:#2d2e32;display:inline-grid;place-content:center}
#lgstudio input[type=checkbox]:checked{background:var(--blue);border-color:var(--blue)}
#lgstudio input[type=checkbox]:checked:after{content:'✓';color:#08121f;font-size:10px;font-weight:900;line-height:1}
#lgstudio .chips{gap:3px;flex-wrap:nowrap;padding:2px;border:1px solid var(--line);border-radius:6px;background:#1f2023}
#lgstudio .chips button{flex:1;min-height:24px;padding:3px 7px;border-radius:4px;color:var(--muted);white-space:nowrap}
#lgstudio .chips button.on{background:#3a3b40;border-color:transparent;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
#lgstudio .hist{position:relative;padding:7px 6px 3px;border:1px solid var(--line);border-radius:6px;background:#191a1d;overflow:hidden}
#lgstudio .hist:before{content:'GRAYSCALE DISTRIBUTION';display:block;margin:0 0 5px;color:#747780;font-size:8px;letter-spacing:.08em}
#lgstudio #hist{height:78px;opacity:.95;background:linear-gradient(to right,#f3f3f3 0%,#cfcfcf 25%,#777 55%,#111 100%)}
#lgstudio #histHandleLayer{position:absolute;left:6px;right:6px;top:31px;height:78px;pointer-events:none;z-index:2}
#lgstudio .histBoundaryHandle{position:absolute;top:-2px;height:82px;width:12px;transform:translateX(-50%);pointer-events:auto;cursor:ew-resize}
#lgstudio .histBoundaryHandle:before{content:'';position:absolute;left:5px;top:0;bottom:0;width:2px;border-radius:2px;background:#5aa9ff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#lgstudio .histBoundaryHandle:after{content:'';position:absolute;left:2px;top:-4px;width:8px;height:8px;border:2px solid #e5f2ff;border-radius:50%;background:#398fe9;box-shadow:0 2px 6px rgba(0,0,0,.45)}
#lgstudio .histBoundaryHandle:hover:before{background:#9bd0ff}
#lgstudio .histBoundaryHandle:hover:after{background:#67b5ff}
#lgstudio .boundarySource{display:none!important}
#lgstudio .boundaryValue{width:42px;height:24px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--field);color:var(--text-2);font-size:10px;text-align:center;font-variant-numeric:tabular-nums}
#lgstudio .boundaryRow{grid-template-columns:46px minmax(78px,1fr) 42px 44px;gap:8px}
#lgstudio .boundaryRow label{padding-left:2px;white-space:nowrap}
#lgstudio .boundaryActions,#lgstudio .boundaryRowActions{display:flex;align-items:center;gap:3px}
#lgstudio .boundaryRowActions{justify-content:flex-end}
#lgstudio .boundaryActions button,#lgstudio .boundaryRowActions button{width:20px;min-width:20px;height:22px;min-height:22px;padding:0;border:1px solid #484a53;border-radius:5px;background:#292a2f;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);color:#aeb1b8;font-size:11px;line-height:1}
#lgstudio .boundaryActions button:hover,#lgstudio .boundaryRowActions button:hover{background:#3b3d44;border-color:#70747e;color:#fff}
#lgstudio .boundaryActions button:disabled,#lgstudio .boundaryRowActions button:disabled{opacity:.28;cursor:not-allowed}
#lgstudio .boundaryRowActions .boundaryDelete:hover{background:#8b3e47;border-color:#c66870}
#lgstudio .segmentCountControl{display:flex;align-items:center;gap:4px;min-width:0}
#lgstudio .segmentCountControl #segCount{flex:1;min-width:0}
#lgstudio .segmentCountControl #segCount[readonly]{cursor:default;color:var(--text-2)}
#lgstudio #addSegment{width:28px;min-width:28px;height:28px;padding:0;border-color:var(--line);background:#292a2e;color:var(--text-2);font-size:16px;line-height:1}
#lgstudio #addSegment:hover{background:#373940;color:#fff;border-color:#62656e}
#lgstudio #addSegment:disabled{opacity:.35;cursor:not-allowed}
#lgstudio .segitem{position:relative;cursor:grab;user-select:none}
#lgstudio .segitem.dragging{opacity:.45;cursor:grabbing}
#lgstudio .segitem.dragOver{outline:1px solid var(--blue);outline-offset:2px;border-radius:5px}
#lgstudio .segDelete{position:absolute;top:-5px;right:-6px;width:14px;min-width:14px;height:14px;min-height:14px;padding:0;border:1px solid #4b4d54;border-radius:50%;background:#28292d;color:#aeb1b8;font-size:10px;line-height:11px;opacity:0;z-index:2}
#lgstudio .segitem:hover .segDelete{opacity:1}
#lgstudio .segDelete:hover{background:#a44747;border-color:#db7777;color:#fff}
#lgstudio #reanalyze{display:none!important}
#lgstudio .swatches,#lgstudio .segments{gap:5px;flex-wrap:wrap}
#lgstudio .sw{width:26px;height:26px;min-height:26px;padding:0;border:1px solid rgba(255,255,255,.18);border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
#lgstudio .sw:hover{transform:translateY(-1px);background:inherit}
#lgstudio .sw.sel:after{inset:-3px;border:2px solid var(--blue);border-radius:7px}
#lgstudio .segitem{gap:4px;font-size:9px;color:#7f828a}
#lgstudio .upload{padding:13px 10px;border:1px dashed #575961;border-radius:6px;background:#26272b;color:#9a9da5;transition:.12s}
#lgstudio .upload:hover{border-color:#7f828b;background:#2c2d32;color:#d9dbe0}
#lgstudio .lock{gap:4px}
#lgstudio .lock button{width:30px;padding:0;border:1px solid var(--line);background:var(--field)}
#lgstudio .fontBlock{margin-top:7px;display:flex;flex-direction:column;gap:5px}
#lgstudio .fontLabel{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}
#lgstudio .figmaFontBadge{padding:2px 5px;border:1px solid #355d87;border-radius:4px;background:#173452;color:#9dcbff;font-size:8px;letter-spacing:.02em}
#lgstudio .fontFields{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:4px}
#lgstudio .fontStatus{display:flex;align-items:center;gap:5px;color:#7f828a;font-size:9px;min-height:13px}
#lgstudio .fontTools{display:flex;align-items:center;gap:6px;margin-top:2px}
#lgstudio .fontTools button{min-height:24px;padding:3px 7px;border:1px solid var(--line);background:var(--field);color:var(--text-2);font-size:10px}
#lgstudio .fontTools button:hover{background:var(--field-hover);color:var(--text)}
#lgstudio .fontStatus:before{content:'';width:6px;height:6px;border-radius:50%;background:#6f7279}
#lgstudio .fontStatus.available:before{background:#55bf82}
#lgstudio .fontStatus.missing:before{background:#d99a4b}
#lgstudio .thumb{width:32px;height:32px;border-radius:5px;border-color:var(--line)}
#lgstudio .picker{width:252px;padding:10px;border:1px solid #4e5057;border-radius:8px;background:#292a2f;box-shadow:0 18px 46px rgba(0,0,0,.5)}
#lgstudio .pickerHead{height:30px;margin:-10px -10px 10px;padding:0 6px 0 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none}
#lgstudio .pickerHead:active{cursor:grabbing}
#lgstudio .pickerGrip{color:#777a82;font-size:12px;letter-spacing:-1px}
#lgstudio .pickerTitle{flex:1;color:var(--text);font-size:11px;font-weight:650}
#lgstudio .pickerClose{width:24px;height:24px;min-height:24px;padding:0;border-radius:5px;color:var(--muted);font-size:16px;line-height:1}
#lgstudio .pickerClose:hover{background:#414248;color:#fff}
#lgstudio .sv{height:156px;border-radius:5px}
#lgstudio .hue,#lgstudio .alpha{height:12px}
#lgstudio .modalBack{position:fixed;background:rgba(4,5,6,.7);backdrop-filter:blur(4px)}
#lgstudio .modal{width:min(378px,calc(100% - 32px));padding:0;border:1px solid #45464d;border-radius:10px;background:#26272b;box-shadow:0 24px 75px rgba(0,0,0,.6);overflow:hidden}
#lgstudio .modal>strong{display:block;padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px}
#lgstudio .modal>.sec{padding:14px 16px}
#lgstudio .modal>.actions{padding:10px 16px;margin:0;border-top:1px solid var(--line);background:#222326}
#lgstudio .hidden{display:none!important}

<div class='app'>
  <div class='bar'><div class='brand'><span class='brandMark'>L</span><span class='brandText'>Luminance Grid</span></div><div class='barGroup'><button id='open' class='quiet'>Open image</button><input id='file' class='hidden' type='file' accept='image/png,image/jpeg,image/webp'><button id='reset'>Reset</button></div><div class='grow'></div><div class='barGroup'><button id='inspect' class='toolOn' title='Probe luminance on canvas'>⌖&nbsp; Inspect</button><button id='preview' class='toolOn' title='Show rendered result'>▶&nbsp; Preview</button><span class='divider'></span><button id='export' class='primary'>Export</button></div></div>
  <div class='layout'>
    <section class='stageWrap'><div class='stage' id='stage'><div class='viewTabs'><button data-view='original' class='on'>Original</button><button data-view='luminance'>Luminance</button><button data-view='result'>Result</button></div><div class='toast' id='toast'></div><canvas id='view'></canvas><div class='canvasMeta'><span class='dotLive'></span><span>Retina preview</span><span>·</span><span id='canvasSize'>Source resolution</span></div></div></section>

  function syncCanvasMeta(){

  const picker=$('#picker'),pickerHead=$('#pickerHead'),pickerClose=$('#pickerClose'),app=$('.app');

      segmentField.replaceWith(control);control.appendChild(segmentField);
      const add=document.createElement('button');add.id='addSegment';add.type='button';add.title='Add segment';add.setAttribute('aria-label','Add segment');add.textContent='+';
      control.appendChild(add);

      add.addEventListener('click',e=>{

      syncAddState();

  }
  function colorHex(el){

    const m=raw.match(/rgba?\(([^)]+)\)/);if(!m)return'#888';

  }
  function setSegmentColor(i,hex){

    if(!sw)return;
    if(applyPalette)sw.click();else{sw.click();$('#segColor')?.click()}
    const field=$('#hex');if(!field)return;
    field.value=hex.replace('#','');field.dispatchEvent(new Event('change',{bubbles:true}));

  }
  const defaultRamp=['#810f7c','#88419d','#8c6bb1','#8c96c6','#9ebcda','#bfd3e6','#e0ecf4','#f7fcfd'];

  }
  function applyDefaultRamp(){

  }
  function moveSegment(from,to){
    if(from===to)return;
    const applyPalette=$('#applyPalette')?.checked!==false;
    const selector=applyPalette?'#palette .sw':'#segments .segitem > .sw';
    const current=[...root.querySelectorAll(selector)].map(colorHex);
    if(from<0||to<0||from>=current.length||to>=current.length)return;

    desired.forEach((color,i)=>{if(color!==current[i])setSegmentColor(i,color)});
  }
  let draggedSegment=-1;
  function decorateSegments(){
    root.querySelectorAll('#segments .segitem').forEach((item,i)=>{
      item.dataset.segmentIndex=String(i);item.draggable=true;
      if(item.dataset.segmentDecorated==='1')return;
      item.dataset.segmentDecorated='1';
      const del=document.createElement('button');del.type='button';del.className='segDelete';del.title='Delete segment';del.setAttribute('aria-label','Delete segment');del.textContent='×';item.appendChild(del);

  function placePicker(x,y){

  }

    const box=picker.getBoundingClientRect(),bounds=app.getBoundingClientRect();

  let drag=null;
  function commitAndClosePicker(e){

  pickerClose?.addEventListener('click',commitAndClosePicker);

  $('#preview')?.addEventListener('click',()=>$('.viewTabs button[data-view="result"]')?.click());
  function hidePaletteMapping(){
    root.querySelectorAll('details').forEach(d=>{if((d.querySelector('summary')?.textContent||'').trim()==='Palette Mapping')d.style.display='none'});
  }
  function initializeLuminanceDefaults(){

  const history={past:[],future:[],current:null,pending:false,timer:0,restoring:false,armed:false};
  const historyGroups=[
    ['.viewTabs','data-view'],['#ratios','data-r'],['#gTabs','data-k'],['#segModes','data-m'],
    ['#sTabs','data-k'],['#edgeModes','data-e']

  function historySnapshot(){
    const controls=[...root.querySelectorAll('input,select,textarea')].filter(el=>el.id).map(el=>({id:el.id,value:el.value,checked:!!el.checked,type:el.type}));
    const groups=historyGroups.map(([selector,key])=>{const box=root.querySelector(selector);return{selector,key,value:box?.querySelector('button.on')?.dataset?.[key]||null}});

  const sameHistory=(a,b)=>JSON.stringify(a)===JSON.stringify(b);

  function restoreHistory(state){
